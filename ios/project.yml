name: SmoothRoute
options:
  bundleIdPrefix: com.smoothroute
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Automatic
targets:
  SmoothRoute:
    type: application
    platform: iOS
    sources:
      - path: SmoothRoute
    info:
      path: SmoothRoute/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoothroute.rider
        PRODUCT_NAME: SmoothRoute
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SmoothRouteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmoothRouteTests
    dependencies:
      - target: SmoothRoute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smoothroute.rider.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  SmoothRoute:
    build:
      targets:
        SmoothRoute: all
        SmoothRouteTests: [test]
    test:
      targets:
        - SmoothRouteTests
