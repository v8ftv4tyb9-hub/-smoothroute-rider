workflows:
  smoothroute-ios:
    name: SmoothRoute Native iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: smoothroute_app_store_connect
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.smoothroute.rider
        XCODE_PROJECT: ios/SmoothRoute.xcodeproj
        XCODE_SCHEME: SmoothRoute
    cache:
      cache_paths:
        - $HOME/Library/Caches/Homebrew
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Initialize signing keychain
        script: |
          keychain initialize
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add signing certificate
        script: |
          keychain add-certificates
      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Run unit tests
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
